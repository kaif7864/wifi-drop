<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  
  <!-- Outer Border Glow -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- WiFi Waves -->
  <!-- Arc 3 (Top) -->
  <path d="M34 46 C49 32 79 32 94 46" fill="none" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Arc 2 (Middle) -->
  <path d="M44 59 C54 49 74 49 84 59" fill="none" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />

  <!-- Arc 1 (Inner) -->
  <path d="M54 72 C59 67 69 67 74 72" fill="none" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Center Glow Dot / Base -->
  <circle cx="64" cy="88" r="7" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="64" cy="88" r="4.5" fill="#FFFFFF" />

  <!-- Fast Transfer File Arrow Accent -->
  <path d="M64 96 L64 104 M60 100 L64 104 L68 100" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>